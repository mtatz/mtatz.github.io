<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description | strip }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="topbar">
    <nav>
      <a href="#top">Home</a>
      <a href="#publications">Publications</a>
      <a href="#theses">Theses</a>
      <a href="#patents">Patents</a>
    </nav>
  </header>
  <main id="top">
    {{ content }}
  </main>
  <footer>&copy; {{ site.time | date: "%Y" }} {{ site.title }}</footer>
</body>
</html>
