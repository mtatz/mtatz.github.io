<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <link rel="canonical" href="{{ site.url }}/{{ page.target }}">
  <meta http-equiv="refresh" content="0; url={{ '/' | relative_url }}{{ page.target }}">
  <meta name="robots" content="noindex">
</head>
<body><p>This page has moved: <a href="{{ '/' | relative_url }}{{ page.target }}">{{ site.url }}/{{ page.target }}</a></p></body>
</html>
