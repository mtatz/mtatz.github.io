# Weekly: pull new works from ORCID and matching YouTube videos, then open a pull request.
name: Sync publications

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/sync_publications.py
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/sync-publications
          commit-message: "Sync publications from ORCID and YouTube"
          title: "New publications from ORCID"
          body: |
            Automatically generated by `scripts/sync_publications.py`.
            New entries have no teaser image yet: add `papers/<id>.png` and set `image:` before merging.
            Check `venue` and `award` fields as well.
          delete-branch: true
